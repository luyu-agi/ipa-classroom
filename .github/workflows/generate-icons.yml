name: generate-icons

on:
  push:
    paths:
      - "tools/make_icons.py"
      - ".github/workflows/generate-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pillow matplotlib
      - name: Generate icons
        run: python tools/make_icons.py
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons
          git commit -m "Generate PWA icons [skip ci]" || echo "no icon changes"
          git push
